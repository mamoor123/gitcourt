name: GitCourt — AI Code Review Tribunal

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  gitcourt:
    runs-on: ubuntu-latest
    name: ⚖️ GitCourt Review
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GitCourt
        run: pip install "git+https://github.com/mamoor123/gitcourt.git#egg=gitcourt[all]"

      - name: Run GitCourt
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL="${{ github.event.pull_request.html_url }}"
          echo "⚖️ Running GitCourt on $PR_URL"

          python -m gitcourt "$PR_URL" --json > verdict.json || true

          # Extract verdict fields
          SCORE=$(python -c "import json; v=json.load(open('verdict.json')); print(int(v.get('verdict',{}).get('score',0)))" 2>/dev/null || echo "0")
          RULING=$(python -c "import json; v=json.load(open('verdict.json')); print(v.get('verdict',{}).get('ruling','No verdict'))" 2>/dev/null || echo "GitCourt could not reach a verdict")
          SENTENCE=$(python -c "import json; v=json.load(open('verdict.json')); print(v.get('verdict',{}).get('sentence',''))" 2>/dev/null || echo "")

          # Determine status
          if [ "$SCORE" -ge 8 ]; then
            EMOJI="✅"
            STATUS="APPROVED"
          elif [ "$SCORE" -ge 6 ]; then
            EMOJI="🔧"
            STATUS="NEEDS WORK"
          elif [ "$SCORE" -ge 4 ]; then
            EMOJI="⚠️"
            STATUS="CHANGES REQUESTED"
          else
            EMOJI="❌"
            STATUS="REJECTED"
          fi

          # Build sections from JSON
          CHARGES_UPHELD=$(python -c "
          import json
          v = json.load(open('verdict.json'))
          charges = v.get('verdict',{}).get('charges_upheld',[])
          if isinstance(charges, str): charges = [charges]
          for c in charges: print(f'- ❌ {c}')
          " 2>/dev/null || echo "")

          CHARGES_DISMISSED=$(python -c "
          import json
          v = json.load(open('verdict.json'))
          charges = v.get('verdict',{}).get('charges_dismissed',[])
          if isinstance(charges, str): charges = [charges]
          for c in charges: print(f'- ✅ {c}')
          " 2>/dev/null || echo "")

          REQUIRED=$(python -c "
          import json
          v = json.load(open('verdict.json'))
          items = v.get('verdict',{}).get('required_changes',[])
          if isinstance(items, str): items = [items]
          for i in items: print(f'- 🔧 {i}')
          " 2>/dev/null || echo "")

          SUGGESTIONS=$(python -c "
          import json
          v = json.load(open('verdict.json'))
          items = v.get('verdict',{}).get('suggestions',[])
          if isinstance(items, str): items = [items]
          for i in items: print(f'- 💡 {i}')
          " 2>/dev/null || echo "")

          PRAISE=$(python -c "
          import json
          v = json.load(open('verdict.json'))
          items = v.get('verdict',{}).get('praise',[])
          if isinstance(items, str): items = [items]
          for i in items: print(f'- 🌟 {i}')
          " 2>/dev/null || echo "")

          PROSECUTION=$(python -c "
          import json
          v = json.load(open('verdict.json'))
          print(v.get('prosecution','N/A')[:1500])
          " 2>/dev/null || echo "")

          DEFENSE=$(python -c "
          import json
          v = json.load(open('verdict.json'))
          print(v.get('defense','N/A')[:1500])
          " 2>/dev/null || echo "")

          # Build comment
          {
            echo "## ⚖️ GitCourt Verdict — ${EMOJI} ${STATUS} (${SCORE}/10)"
            echo ""
            echo "> ${RULING}"
            echo ""

            echo "<details>"
            echo "<summary>🔴 The Prosecution</summary>"
            echo ""
            echo "${PROSECUTION}"
            echo ""
            echo "</details>"
            echo ""

            echo "<details>"
            echo "<summary>🔵 The Defense</summary>"
            echo ""
            echo "${DEFENSE}"
            echo ""
            echo "</details>"
            echo ""

            if [ -n "$CHARGES_UPHELD" ]; then
              echo "### Charges Upheld"
              echo "${CHARGES_UPHELD}"
              echo ""
            fi

            if [ -n "$CHARGES_DISMISSED" ]; then
              echo "### Charges Dismissed"
              echo "${CHARGES_DISMISSED}"
              echo ""
            fi

            if [ -n "$REQUIRED" ]; then
              echo "### Required Before Merge"
              echo "${REQUIRED}"
              echo ""
            fi

            if [ -n "$SUGGESTIONS" ]; then
              echo "### Suggestions"
              echo "${SUGGESTIONS}"
              echo ""
            fi

            if [ -n "$PRAISE" ]; then
              echo "### Commendations"
              echo "${PRAISE}"
              echo ""
            fi

            if [ -n "$SENTENCE" ]; then
              echo "> _\"${SENTENCE}\"_"
              echo ""
            fi

            echo "---"
            echo "_🤖 Delivered by [GitCourt](https://github.com/mamoor123/gitcourt) — Three AI agents. One PR. Justice._"
          } > comment.md

      - name: Post verdict to PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: gitcourt
          path: comment.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
