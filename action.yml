name: "GitCourt — AI Code Review"
description: "Three AI agents debate your PR. The Judge delivers the verdict."
branding:
  icon: "shield"
  color: "blue"

inputs:
  github-token:
    description: "GitHub token for posting comments"
    required: false
    default: ${{ github.token }}
  openai-api-key:
    description: "OpenAI API key (required for openai provider)"
    required: false
    default: ""
  anthropic-api-key:
    description: "Anthropic API key (required for anthropic provider)"
    required: false
    default: ""
  provider:
    description: "LLM provider: openai, anthropic, ollama"
    required: false
    default: "openai"
  model:
    description: "Model name (default: provider-specific)"
    required: false
    default: ""
  pr-url:
    description: "PR URL (default: current PR)"
    required: false
    default: ${{ github.event.pull_request.html_url }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install GitCourt
      shell: bash
      run: pip install "git+https://github.com/mamoor123/gitcourt.git#egg=gitcourt[all]"

    - name: Run GitCourt
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        MODEL_FLAG=""
        if [ -n "${{ inputs.model }}" ]; then
          MODEL_FLAG="--model '${{ inputs.model }}'"
        fi
        python -m gitcourt "${{ inputs.pr-url }}" \
          --provider "${{ inputs.provider }}" \
          $MODEL_FLAG \
          --json > verdict.json || true

    - name: Build comment
      shell: bash
      if: always()
      run: |
        python3 << 'SCRIPT'
        import json, os

        def as_list(v):
            if isinstance(v, list): return v
            if isinstance(v, str) and v: return [v]
            return []

        try:
            with open('verdict.json') as f:
                data = json.load(f)
        except Exception:
            with open('comment.md', 'w') as f:
                f.write("## ⚖️ GitCourt\n\n_GitCourt could not reach a verdict._\n")
            raise SystemExit(0)

        v = data.get('verdict', {})
        score = max(1, min(10, int(v.get('score', 0))))
        ruling = v.get('ruling', 'No ruling')
        sentence = v.get('sentence', '')

        if score >= 8: emoji, status = "✅", "APPROVED"
        elif score >= 6: emoji, status = "🔧", "NEEDS WORK"
        elif score >= 4: emoji, status = "⚠️", "CHANGES REQUESTED"
        else: emoji, status = "❌", "REJECTED"

        bar_filled = int(score * 4)
        bar_empty = 40 - bar_filled
        bar = "█" * bar_filled + "░" * bar_empty

        lines = [f"## ⚖️ GitCourt Verdict — {emoji} {status} ({score}/10)\n"]
        lines.append(f"> {ruling}\n")
        lines.append(f"`[{bar}]` **{score}/10**\n")

        prosecution = data.get('prosecution', '')
        defense = data.get('defense', '')

        if prosecution:
            lines.append(f"<details><summary>🔴 The Prosecution</summary>\n\n{prosecution[:1500]}\n\n</details>\n")
        if defense:
            lines.append(f"<details><summary>🔵 The Defense</summary>\n\n{defense[:1500]}\n\n</details>\n")

        charges_upheld = as_list(v.get('charges_upheld'))
        if charges_upheld:
            lines.append("### Charges Upheld")
            for c in charges_upheld:
                lines.append(f"- ❌ {c}")
            lines.append("")

        charges_dismissed = as_list(v.get('charges_dismissed'))
        if charges_dismissed:
            lines.append("### Charges Dismissed")
            for c in charges_dismissed:
                lines.append(f"- ✅ {c}")
            lines.append("")

        required = as_list(v.get('required_changes'))
        if required:
            lines.append("### Required Before Merge")
            for c in required:
                lines.append(f"- 🔧 {c}")
            lines.append("")

        suggestions = as_list(v.get('suggestions'))
        if suggestions:
            lines.append("### Suggestions")
            for c in suggestions:
                lines.append(f"- 💡 {c}")
            lines.append("")

        if sentence:
            lines.append(f"> _\"{sentence}\"_\n")

        lines.append("---\n_🤖 Delivered by [GitCourt](https://github.com/mamoor123/gitcourt)_")

        with open('comment.md', 'w') as f:
            f.write("\n".join(lines))
        SCRIPT

    - name: Post verdict
      if: always()
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: gitcourt
        path: comment.md
        GITHUB_TOKEN: ${{ inputs.github-token }}
