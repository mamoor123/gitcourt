<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2ea043"/>
      <stop offset="100%" stop-color="#1a7f37"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect x="0" y="0" width="620" height="520" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Header -->
  <rect x="0" y="0" width="620" height="40" rx="8" fill="#f6f8fa"/>
  <rect x="0" y="32" width="620" height="8" fill="#f6f8fa"/>
  <line x1="0" y1="40" x2="620" y2="40" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="20" cy="20" r="5" fill="#ff6a69"/>
  <circle cx="38" cy="20" r="5" fill="#f5c542"/>
  <circle cx="56" cy="20" r="5" fill="#4ac26b"/>
  <rect x="75" y="12" width="470" height="18" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="83" y="25" fill="#57606a" font-size="11">https://github.com/acme/api/pull/42</text>

  <!-- PR title -->
  <text x="20" y="72" fill="#24292f" font-size="18" font-weight="600">Add JWT authentication middleware</text>
  <rect x="20" y="82" width="48" height="20" rx="10" fill="#d1fabe" stroke="#a5d68b" stroke-width="1"/>
  <text x="30" y="96" fill="#1a7f37" font-size="11" font-weight="600">open</text>
  <text x="78" y="96" fill="#57606a" font-size="12">@devguru wants to merge 3 commits into main</text>

  <line x1="20" y1="110" x2="600" y2="110" stroke="#d0d7de" stroke-width="1"/>

  <!-- Comment -->
  <circle cx="30" cy="132" r="14" fill="#1f6feb"/>
  <text x="24" y="137" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">⚖️</text>
  <text x="52" y="136" fill="#24292f" font-size="13" font-weight="600">GitCourt</text>
  <text x="110" y="136" fill="#57606a" font-size="12">bot commented 2 minutes ago</text>

  <!-- Verdict header -->
  <rect x="20" y="152" width="580" height="40" rx="6" fill="#ddf4ff" stroke="#54aeff" stroke-width="1"/>
  <text x="30" y="177" fill="#0969da" font-size="15" font-weight="600">⚖️ GitCourt Verdict — 🔧 NEEDS WORK (7/10)</text>

  <!-- Ruling -->
  <rect x="20" y="200" width="580" height="36" rx="4" fill="#f6f8fa"/>
  <text x="30" y="223" fill="#57606a" font-size="12" font-style="italic">"Solid implementation with room for improvement. Fix the</text>
  <text x="30" y="238" fill="#57606a" font-size="12" font-style="italic"> security issues and this is good to go."</text>

  <!-- Score bar -->
  <text x="30" y="268" fill="#24292f" font-size="13" font-weight="600">Score: 7/10</text>
  <rect x="115" y="256" width="200" height="14" rx="3" fill="#e6e8eb"/>
  <rect x="115" y="256" width="140" height="14" rx="3" fill="#2ea043"/>
  <text x="325" y="268" fill="#2ea043" font-size="13" font-weight="600">APPROVED ✅</text>

  <line x1="20" y1="284" x2="600" y2="284" stroke="#d0d7de" stroke-width="1"/>

  <!-- Collapsible: Prosecution -->
  <rect x="20" y="294" width="580" height="28" rx="4" fill="#fff8f8" stroke="#cf222e" stroke-width="0.5"/>
  <text x="30" y="313" fill="#cf222e" font-size="12" font-weight="600">▼ 🔴 The Prosecution</text>

  <!-- Collapsible: Defense -->
  <rect x="20" y="328" width="580" height="28" rx="4" fill="#ecf2fe" stroke="#0969da" stroke-width="0.5"/>
  <text x="30" y="347" fill="#0969da" font-size="12" font-weight="600">▼ 🔵 The Defense</text>

  <!-- Required changes -->
  <text x="30" y="382" fill="#24292f" font-size="13" font-weight="600">Required Before Merge</text>
  <text x="30" y="400" fill="#57606a" font-size="12">🔧 Move JWT secret to environment variables</text>
  <text x="30" y="418" fill="#57606a" font-size="12">🔧 Add input validation on token endpoint</text>

  <!-- Suggestions -->
  <text x="30" y="448" fill="#24292f" font-size="13" font-weight="600">Suggestions</text>
  <text x="30" y="466" fill="#57606a" font-size="12">💡 Add rate limiting documentation</text>

  <!-- Sentence -->
  <rect x="20" y="480" width="580" height="28" rx="4" fill="#f6f8fa"/>
  <text x="30" y="499" fill="#57606a" font-size="11" font-style="italic">"The defendant is sentenced to 2 code reviews and a .env file. Case dismissed."</text>
</svg>
