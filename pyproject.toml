[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitcourt"
version = "1.0.0"
description = "⚖️ Three AI agents debate your Pull Request. The Judge delivers the verdict."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
all = ["openai>=1.0.0", "anthropic>=0.18.0"]

[project.scripts]
gitcourt = "gitcourt.cli:main"

[tool.setuptools.packages.find]
include = ["gitcourt*"]
